services:
  server:
    build:
      context: ../..
      dockerfile: docker/manual/Dockerfile
    image: storagesign-manual-server
    container_name: storagesign-manual-server
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-1.21.11}
      PAPER_BUILD: ${PAPER_BUILD:-69}
      MEMORY: 3G
      ONLINE_MODE: "FALSE"
      MODE: creative
      DIFFICULTY: peaceful
      LEVEL_TYPE: minecraft:flat
      GENERATE_STRUCTURES: "FALSE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MAX_TICK_TIME: "-1"
      ENABLE_COMMAND_BLOCK: "TRUE"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
    ports:
      - "127.0.0.1:${MANUAL_PORT:-25565}:25565"
    volumes:
      - validation-data:/data
      - ./local/ops.json:/data/ops.json:ro
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 24
    stop_grace_period: 30s
    stdin_open: true
    tty: true

volumes:
  validation-data:
