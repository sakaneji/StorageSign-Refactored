services:
  server:
    image: ${MC_SERVER_IMAGE:-itzg/minecraft-server:java21}
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: ${MC_VERSION:-1.21.4}
      PAPER_BUILD: ${PAPER_BUILD:-232}
      MEMORY: 3G
      ONLINE_MODE: "FALSE"
      MODE: creative
      LEVEL_TYPE: minecraft:flat
      GENERATE_STRUCTURES: "FALSE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      MAX_TICK_TIME: "-1"
      ENABLE_COMMAND_BLOCK: "TRUE"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
    ports:
      - "127.0.0.1:${E2E_PORT:-25565}:25565"
    volumes:
      - ${E2E_DATA_DIR:-./runtime/default/data}:/data
      - ${E2E_PLUGIN_DIR:-./runtime/default/plugins}:/plugins:ro
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 24
    stop_grace_period: 30s

  bot:
    build:
      context: ./bot
    environment:
      MC_HOST: server
      MC_PORT: "25565"
      MC_VERSION: ${MC_VERSION:-1.21.4}
      E2E_PHASE: ${E2E_PHASE:-main}
      LOGGER_MODE: ${LOGGER_MODE:-without-logger}
      E2E_TIMEOUT_MS: "45000"
    depends_on:
      server:
        condition: service_healthy
