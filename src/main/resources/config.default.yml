# StorageSign Configuration
no-permisson: You don't have permission

# Log level: OFF / ERROR / WARN / INFO / DEBUG / TRACE / ALL
# Legacy JUL names (SEVERE/WARNING/CONFIG/FINE/FINER/FINEST) are also accepted.
log-level: INFO

# Allow players to manually push/pull items by right-clicking with the matching item
manual-import: true
manual-export: true

# Allow transport blocks (hopper/dropper/dispenser/crafter/hopper minecart/chest minecart/chest boat) to automatically move items into/out of StorageSigns
auto-import: true
auto-export: true

# Automatically collect dropped items into a held registered StorageSign when the hand holds exactly one
# and the player inventory already has at least one full stack of the same item
autocollect: true

# Harder crafting recipe (requires Ender Chest instead of a second Chest)
hardrecipe: false

# Maximum items assigned to each empty StorageSign during right-click split
divide-limit: 345600
sneak-divide-limit: 34560

# Maximum number of StorageSigns that can be stacked as a single item
max-stack-size: 16

# If true, when a registered StorageSign reaches 0 items it becomes unregistered (Empty).
# If false, registration is kept at 0 and only cleared when the sign itself is broken.
unregister-on-empty: false

# Prevent BUD pulses from breaking adjacent StorageSigns
no-bud: false

# Drop adjacent StorageSigns when a falling block lands on their support block
falling-block-itemSS: false

# Debug: at TRACE level, log raw ItemMeta for main-hand right-clicked items (very verbose)
banner-debug: false

# Maintain an in-memory index of StorageSign block positions from loaded chunks,
# while retaining last-verified entries after those chunks unload.
# The index never loads chunks for searches, loads persisted data on startup,
# and revalidates only currently loaded chunks against live world data.
storage-index:
  enabled: true
  rebuild-chunks-per-tick: 8
  chunk-rescan-queue-cap: 512

# Show full stored identifiers near players after they stop moving.
# Looking around marks the display for rescan, and labels appear only when the sign text would otherwise be shortened.
# Once shown, a label remains visible while moving until it leaves the configured distance.
# This feature is automatically disabled when storage-index.enabled is false.
nearby-display:
  enabled: true
  distance: 3.0
  field-of-view-degrees: 90.0
  idle-delay-ticks: 10
  monitor-interval-ticks: 5
  max-per-player: 3
  max-searches-per-tick: 25
  global-label-limit: 512

# Administrative searches run from an immutable index snapshot.
admin-search:
  page-size: 10
  max-concurrent: 2

# Compatibility alias table for identifier parsing.
# Key: identifier token found on sign/lore, Value: current Material name.
# Add entries here to absorb MC rename changes or custom migration aliases without code changes.
item-identifier-aliases:
  SIGN: OAK_SIGN
  ROSE_RED: RED_DYE
  DANDELION_YELLOW: YELLOW_DYE
  CACTUS_GREEN: GREEN_DYE
  OMINOUS_BOTTLE: OMINOUS_BOTTLE
  ENCHBOOK: ENCHANTED_BOOK
  SPOTION: SPLASH_POTION
  LPOTION: LINGERING_POTION
  STONE_SLAB: SMOOTH_STONE_SLAB

# Potion registry-key migrations. Quotes are required because keys contain ':'.
# Applied only when the original key no longer exists in the running server registry.
potion-key-aliases: {}
#  "minecraft:old_potion": "minecraft:replacement_potion"

# Additional brewing ingredients introduced by a server or future Minecraft version.
# Built-in vanilla ingredients remain enabled automatically.
brewing-ingredient-identifiers: []

# Virtual identifier table.
# Key: identifier text on sign/lore, Value: backing storage representation MATERIAL[:damage].
# Use this for legacy marker identifiers (example: HorseEgg) or server-specific migrations.
virtual-item-identifiers:
  EmptySign: OAK_SIGN:1
  HorseEgg: END_PORTAL:1
