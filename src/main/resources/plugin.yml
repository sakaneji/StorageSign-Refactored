name: ${project.artifactId}
main: storagesign.StorageSignPlugin
version: ${project.version}
description: Refactored StorageSign plugin for Paper servers.
api-version: '1.21.4'
authors:
    - hirot
website: https://github.com/sakaneji/StorageSign-Refactored
license: MIT
softdepend:
    - Logger

commands:
    storagesigngive:
        description: Give a StorageSign item in creative mode.
        usage: /<command> <itemIdentifier> <amount> [signType]
        aliases:
            - ssgive
        permission: storagesign.give
    storagesignindex:
        description: Inspect or rebuild the StorageSign position index.
        usage: /<command> [status|rebuild [all|world]]
        aliases:
            - ssindex
        permission: storagesign.index.admin
    storagesignsearch:
        description: Search indexed StorageSigns by stored item identifier.
        usage: /<command> item <identifier> [--contains] [--coords|--front] [--world world] [--page number]
        aliases:
            - sssearch
        permission: storagesign.search.admin
    storagesignwarp:
        description: Warp to the front of the nearest StorageSign storing an item.
        usage: /<command> <itemIdentifier|--hand>
        aliases:
            - sswarp

permissions:
    storagesign.*:
        description: Grants all StorageSign permissions.
        default: op
        children:
            storagesign.use: true
            storagesign.craft: true
            storagesign.place: true
            storagesign.break: true
            storagesign.give: true
            storagesign.autocollect: true
            storagesign.index.admin: true
            storagesign.search.admin: true

    storagesign.use:
        description: Allows using StorageSign interactions.
        default: true

    storagesign.craft:
        description: Allows crafting StorageSign items.
        default: true

    storagesign.place:
        description: Allows placing StorageSign items as signs.
        default: true

    storagesign.break:
        description: Allows breaking StorageSign blocks and their support blocks.
        default: true

    storagesign.give:
        description: Allows using /storagesigngive in creative mode.
        default: true

    storagesign.autocollect:
        description: Allows automatic pickup/import behavior.
        default: true

    storagesign.index.admin:
        description: Allows inspecting and rebuilding the StorageSign index.
        default: op

    storagesign.search.admin:
        description: Allows searching the current StorageSign index snapshot.
        default: op
